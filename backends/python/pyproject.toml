[project]
name = "syncplex"
version = "0.1.0"
description = "Sync_Plex media remote — multi-instance Sonarr/Radarr/Plex search/status/add"
requires-python = ">=3.14"
dependencies = [
    "typer>=0.12",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "textual>=8.2.8",
    "nicegui>=3.14.0",
    "argon2-cffi>=25.1.0",
    "psycopg[binary]>=3.2",
    "pyjwt>=2.10",
]

[project.scripts]
syncplex = "engine.cli:app"
syncplex-drive-sync = "drive_sync.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine", "drive_sync"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E203"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# `type: ignore` comments are only worth writing if something checks them —
# warn_unused_ignores is what catches one that a reformat detached from the
# line it was suppressing.
[tool.mypy]
python_version = "3.14"
files = ["engine", "drive_sync", "tests"]
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = "readable_utils.*"  # third-party, ships no py.typed marker
ignore_missing_imports = true

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pytest>=9.0.2",
    "ruff>=0.11",
    "types-pyyaml>=6.0",
]
# Everything the web image never imports lives in this group, not in
# project.dependencies, so the Docker image stays lean: the drive sync and
# the TUIs (readable-utils carries the shared terminal-navy theme). Local
# `uv sync` installs it via default-groups; the Dockerfile syncs with
# --no-default-groups.
drive-sync = [
    "pyyaml>=6.0.2",
    "readable-utils",
    "requests>=2.32.3",
]

[tool.uv]
default-groups = ["dev", "drive-sync"]

[tool.uv.sources]
readable-utils = { git = "https://github.com/ReadableCode/readable_utils.git", tag = "v0.3.3" }

